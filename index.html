<!-- Lets the file also run straight from disk / any static host. Under Vite the
     bare "three" imports are resolved from node_modules instead. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"

<style>
  :root {
    --card: clamp(88px, 17vmin, 168px);
    --btn: clamp(68px, 11.5vmin, 104px);
    --ink: #6b5a8e;
    --pink: #ff8fc0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #bfe7ff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; cursor: pointer; touch-action: manipulation; font: inherit; }

  .btn {
    position: relative; width: var(--btn); height: var(--btn); border-radius: 50%; border: none; padding: 0;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fff4fa 70%, #ffe6f2 100%);
    box-shadow: 0 6px 0 rgba(150, 110, 190, .28), 0 12px 26px rgba(80, 60, 140, .2);
    display: grid; place-items: center;
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), opacity .45s ease;
  }
  .btn svg { width: 66%; height: 66%; pointer-events: none; }
  .btn:active { transform: scale(.88); }
  .btn.disabled { opacity: .38; }
  .gone { opacity: 0 !important; pointer-events: none !important; transform: scale(.6) !important; }

  #muteBtn { position: absolute; left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); }
  #topRight {
    position: absolute; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top));
    display: flex; gap: clamp(10px, 2vmin, 18px); transition: opacity .45s ease;
  }
  #topRight.gone { transform: none !important; }
  #diceBtn.roll svg { animation: roll .7s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes roll { from { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.15); } to { transform: rotate(360deg) scale(1); } }

  #steps {
    position: absolute; top: max(22px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; padding: 8px 14px; border-radius: 40px; background: rgba(255, 255, 255, .55);
    transition: opacity .45s ease;
  }
  .step { width: clamp(38px, 6.5vmin, 54px); height: clamp(38px, 6.5vmin, 54px); border-radius: 50%; background: #fff;
    display: grid; place-items: center; opacity: .5; transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .45s, box-shadow .45s; }
  .step svg { width: 78%; height: 78%; }
  .step.on { opacity: 1; transform: scale(1.18); box-shadow: 0 0 0 4px #ffb3d6; }
  .step.done { opacity: .95; }

  #tray {
    position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: clamp(10px, 2.6vmin, 26px); transition: opacity .45s ease;
  }
  #tray.gone { transform: translateX(-50%) translateY(30px) !important; }
  .card {
    width: var(--card); height: var(--card); border-radius: 28%; border: none; padding: 0;
    background: radial-gradient(circle at 50% 32%, #ffffff 0%, #fff7fb 60%, #ffeaf4 100%);
    box-shadow: 0 7px 0 rgba(150, 110, 190, .25), 0 14px 28px rgba(80, 60, 140, .18), inset 0 0 0 5px var(--accent, #ffd3e6);
    display: grid; place-items: center;
    transition: transform .4s cubic-bezier(.3, 1.6, .5, 1), opacity .3s ease, box-shadow .35s ease;
  }
  .card img { width: 94%; height: 94%; pointer-events: none; -webkit-user-drag: none; }
  .card:active { transform: scale(.9); }
  .card.enter { opacity: 0; transform: translateY(70px) scale(.7); }
  .card.leave { opacity: 0; transform: translateY(50px) scale(.75); }
  .card.sel { transform: translateY(-12px) scale(1.08);
    box-shadow: 0 7px 0 rgba(150, 110, 190, .25), 0 18px 30px rgba(255, 120, 180, .35), inset 0 0 0 7px var(--accent, #ff8fc0), 0 0 0 6px #fff; }
  .card.sel img { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }

  #bellBtn {
    position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: calc(var(--btn) * 1.45); height: calc(var(--btn) * 1.45); border-radius: 50%; border: none; padding: 0;
    background: radial-gradient(circle at 50% 35%, #fffef2 0%, #fff3c4 65%, #ffe08a 100%);
    box-shadow: 0 7px 0 rgba(220, 150, 40, .35), 0 16px 30px rgba(200, 120, 40, .28);
    display: grid; place-items: center;
    transition: transform .4s cubic-bezier(.3, 1.6, .5, 1), opacity .45s ease;
  }
  #bellBtn svg { width: 76%; height: 76%; pointer-events: none; animation: bellIdle 2.4s ease-in-out infinite; transform-origin: 50% 80%; }
  #bellBtn.ring svg { animation: bellRing .8s ease-in-out; }
  #bellBtn:active { transform: scale(.88); }
  @keyframes bellIdle { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg) translateY(-3px); } }
  @keyframes bellRing { 0% { transform: rotate(0); } 15% { transform: rotate(16deg); } 35% { transform: rotate(-14deg); } 55% { transform: rotate(10deg); } 75% { transform: rotate(-6deg); } 100% { transform: rotate(0); } }

  #newBatchBtn {
    position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); margin-left: calc(var(--btn) * -0.9);
    width: calc(var(--btn) * 1.8); height: calc(var(--btn) * 1.8); border-radius: 50%; border: 6px solid #fff; padding: 0;
    background: radial-gradient(circle at 40% 30%, #ffc3de 0%, #ff8fc0 55%, #f56fae 100%);
    box-shadow: 0 8px 0 rgba(200, 80, 140, .35), 0 18px 36px rgba(200, 80, 140, .3);
    display: grid; place-items: center; animation: breathe 2.2s ease-in-out infinite;
    transition: opacity .5s ease;
  }
  #newBatchBtn svg { width: 74%; height: 74%; pointer-events: none; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 4vmin, 40px); pointer-events: none; transition: opacity .9s ease;
    background: radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .15) 45%, rgba(255, 255, 255, 0) 70%);
  }
  #title.gone { transform: none !important; }
  .logo {
    font-size: clamp(48px, 12vmin, 124px); font-weight: 700; color: #fff; letter-spacing: .02em; line-height: 1;
    text-shadow: 0 5px 0 #ff8fc0, 0 10px 0 #b49bff, 0 18px 30px rgba(120, 80, 180, .35);
    -webkit-text-stroke: 3px #ff7ab3; paint-order: stroke fill; animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  #playBtn {
    width: clamp(130px, 26vmin, 200px); height: clamp(130px, 26vmin, 200px); border-radius: 50%; border: 8px solid #fff; padding: 0;
    background: radial-gradient(circle at 38% 30%, #ffd08a 0%, #ff9fb8 55%, #ff7ab3 100%);
    box-shadow: 0 10px 0 rgba(220, 90, 140, .4), 0 22px 40px rgba(200, 80, 140, .35);
    display: grid; place-items: center; animation: breathe 2s ease-in-out infinite;
  }
  #playBtn svg { width: 56%; height: 56%; margin-left: 8%; pointer-events: none; }

  #hand {
    position: absolute; left: 0; top: 0; width: clamp(78px, 12vmin, 108px); aspect-ratio: 120 / 160;
    transform-origin: 36.7% 3.75%; opacity: 0; transition: opacity .45s ease; pointer-events: none;
    filter: drop-shadow(0 8px 10px rgba(80, 60, 140, .3)); z-index: 5;
  }
  #hand.show { opacity: 1; }
  #hand svg { width: 100%; height: 100%; display: block; }
  .ripple {
    position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, .95); box-shadow: 0 0 0 4px rgba(255, 143, 192, .5);
    animation: rip .75s ease-out forwards; pointer-events: none; z-index: 4;
  }
  @keyframes rip { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.3); opacity: 0; } }

  @media (orientation: portrait) {
    #bellBtn { bottom: calc(var(--card) + max(14px, env(safe-area-inset-bottom)) + 34px); }
    #steps { top: calc(max(16px, env(safe-area-inset-top)) + var(--btn) + 14px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, #playBtn, #newBatchBtn, #bellBtn svg, .card.sel img { animation: none; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   Cloud Cafe — a cupcake-decorating toy. Everything is built in code:
   geometry, textures, icons (inline SVG) and sound (Web Audio synth).
   ===================================================================== */

const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const UP = new V3(0, 1, 0);
const DOWN = new V3(0, -1, 0);
// Direction toward the viewer in cupcake space. Used to tilt eyes/stars so they
// face the child. Constant so rebuilds look identical in any window shape.
const CAM_DIR = new V3(0, 0.6, 1).normalize();

/* ---------- small helpers ---------- */
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => (b === undefined ? Math.floor(Math.random() * a) : a + Math.floor(Math.random() * (b - a + 1)));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const Ease = {
  linear: (t) => t,
  inOut: (t) => 0.5 - 0.5 * Math.cos(Math.PI * t),
  out: (t) => 1 - (1 - t) ** 3,
  in: (t) => t * t,
  outBack: (t) => { const c = 1.6; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
};
function lighten(hex, k = 0.55) { return '#' + new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), k).getHexString(); }

/* ---------- tweens (game-clock driven, promise based) ---------- */
let speed = 1; // debug/test time multiplier
const tweens = [];
function tween(dur, fn, ease = Ease.inOut, key = null) {
  return new Promise((res) => {
    if (key) for (const tw of tweens) if (tw.key === key && !tw.done) { tw.done = true; tw.res(); }
    tweens.push({ t: 0, dur: Math.max(1e-4, dur), fn, ease, key, res, done: false });
  });
}
const wait = (s) => tween(s, () => {}, Ease.linear);
function updateTweens(dt) {
  for (let i = 0; i < tweens.length; i++) {
    const tw = tweens[i];
    if (tw.done) continue;
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(k), k);
    if (k >= 1) { tw.done = true; tw.res(); }
  }
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].done) tweens.splice(i, 1);
}

/* ---------- squishy springs: poke() an object and it wobbles back ---------- */
const springs = new Set();
function squishy(obj, k = 170, c = 8) {
  const s = { obj, x: 0, v: 0, k, c, base: obj.scale.clone(), dead: false };
  obj.userData.spring = s; springs.add(s); return s;
}
function poke(obj, v) { const s = obj && obj.userData.spring; if (s) s.v += v; }
function updateSprings(dt) {
  const n = Math.ceil(dt / 0.016), h = dt / n;
  for (const s of springs) {
    if (s.dead) { springs.delete(s); continue; }
    for (let i = 0; i < n; i++) { s.v += (-s.k * s.x - s.c * s.v) * h; s.x += s.v * h; }
    const x = clamp(s.x, -0.45, 0.45);
    s.obj.scale.set(s.base.x * (1 + x * 0.5), s.base.y * (1 - x), s.base.z * (1 + x * 0.5));
  }
}

/* =====================================================================
   Renderer, scene, lights
   ===================================================================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#dcefff', 28, 95);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 220);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;
}
scene.add(new THREE.HemisphereLight('#e2f2ff', '#ffd3e6', 1.3));
const sun = new THREE.DirectionalLight('#fff3df', 2.3);
sun.position.set(3.5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 7, bottom: -6, near: 1, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 5;
scene.add(sun);
const fill = new THREE.DirectionalLight('#ffd9f2', 0.7);
fill.position.set(-6, 4, 3);
scene.add(fill);

/* ---------- shared geometry & material registry ---------- */
const sharedGeos = new Set();
const sharedMats = new Set();
const share = (g) => { sharedGeos.add(g); return g; };
const SPHERE = share(new THREE.SphereGeometry(1, 32, 20));
const CONE = share(new THREE.ConeGeometry(1, 1, 24));
const matCache = new Map();
function mat(color, rough = 0.55, extra) {
  const key = color + '|' + rough + '|' + (extra ? JSON.stringify(extra) : '');
  let m = matCache.get(key);
  if (!m) { m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, ...(extra || {}) }); matCache.set(key, m); sharedMats.add(m); }
  return m;
}
function ball(r, color, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, rough = 0.55) {
  const m = new THREE.Mesh(SPHERE, mat(color, rough));
  m.position.set(x, y, z); m.scale.set(r * sx, r * sy, r * sz); m.castShadow = true;
  return m;
}
const googlies = new Set();
function disposeTree(o) {
  o.traverse((c) => {
    if (c.isMesh) {
      if (!sharedGeos.has(c.geometry)) c.geometry.dispose();
      const ms = Array.isArray(c.material) ? c.material : [c.material];
      for (const m of ms) if (!sharedMats.has(m)) m.dispose();
    }
    if (c.userData.googly) { c.userData.googly.dead = true; googlies.delete(c.userData.googly); }
    if (c.userData.spring) c.userData.spring.dead = true;
  });
}

/* =====================================================================
   Sky, rainbow, marshmallow clouds
   ===================================================================== */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(110, 32, 16),
  new THREE.ShaderMaterial({

    m.rotation.x += p.spin.x * dt; m.rotation.y += p.spin.y * dt; m.rotation.z += p.spin.z * dt;

renderer.domElement.addEventListener('pointerdown', (e) => {
  noteInput();
  if (mode === 'title') return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  scene.updateMatrixWorld();
  if (mode === 'build' && cup && cup.body) {
    const parts = [cup.proxy, ...cup.body.userData.parts]; if (cup.frostMesh) parts.push(cup.frostMesh);
    if (raycaster.intersectObjects(parts, false).length) { tapCupcake(raycaster.ray); return; }
  }
  const hits = raycaster.intersectObjects(toyTargets, true);
  if (hits.length) {
    let o = hits[0].object; while (o && !o.userData.toy) o = o.parent;
    if (o) tapToy(o, hits[0]);
  }
});
/** Ray -> cupcake-local (x, z) on the frosting; taps on the sides land on the top. */
function tapLocalXZ(ray) {
  const hit = raycaster.intersectObject(cup.frostMesh, false)[0];
  let p;
  if (hit) p = cup.squish.worldToLocal(hit.point.clone());
  else {
    const S = SHAPES[state.shape], F = FROSTINGS[state.frost];
    const midY = cup.squish.localToWorld(new V3(0, (frostSurfaceY(S, F, 0, 0) + S.h) * 0.5, 0)).y;
    const hitP = ray.intersectPlane(new THREE.Plane(new V3(0, 1, 0), -midY), new V3());
    p = hitP ? cup.squish.worldToLocal(hitP) : new V3();
  }
  return { x: p.x, z: p.z };
}
function tapCupcake(ray) {
  if (state.frost == null) { poke(cup.squish, 3); audio.squish(); kickGooglies(cup, 1); return; }
  const { x, z } = tapLocalXZ(ray);
  placeDecoration(x, z);
}
function tapToy(o, hit) {
  const u = o.userData;
  if (u.toy === 'utensil') {
    const ut = utensils[u.idx]; if (ut.busy) return; ut.busy = true; audio.boing(0.9 + u.idx * 0.1);
    tween(0.75, (k) => { ut.jump = Math.sin(Math.PI * k) * 0.9; ut.spin = TAU * Ease.inOut(k); }, Ease.linear).then(() => { ut.jump = 0; ut.spin = 0; ut.busy = false; });
  } else if (u.toy === 'animal') {
    if (u.busy || mode === 'serving' || mode === 'parade' || mode === 'transition') return;
    u.busy = true; audio.giggle(); u.happy = 1.2; poke(u.squ, 3);
    const y0 = o.position.y;
    tween(0.45, (k) => { o.position.y = y0 + Math.sin(Math.PI * k) * 0.35; }, Ease.linear).then(() => { o.position.y = y0; poke(u.squ, 2.5); u.busy = false; });
  } else if (u.toy === 'platform') { poke(o.children[o.children.length - 1], 3); audio.squish(); }
  else if (u.toy === 'marsh') { poke(o.children[0], 4); u.spinBoost = 6; audio.pop(0.8); }
  else if (u.toy === 'island') { const m = hit.object; if (m.userData.base) { m.userData.poke = 1; audio.pop(0.7); } }
}

/* =====================================================================
   Frame loop
   ===================================================================== */
const _gq = new THREE.Quaternion(), _gd = new V3();
function updateGooglies(dt) {
  for (const g of googlies) {
    if (g.dead || !g.node.parent) continue;
    g.node.getWorldQuaternion(_gq).invert();
    _gd.copy(DOWN).applyQuaternion(_gq);
    g.vel.x += _gd.x * 5 * dt; g.vel.y += _gd.z * 5 * dt;
    g.vel.multiplyScalar(Math.pow(0.25, dt));
    g.off.addScaledVector(g.vel, dt);
    const max = g.size - g.pr * 1.05, l = g.off.length();
    if (l > max) { g.off.multiplyScalar(max / l); const n = g.off.clone().normalize(), vn = g.vel.dot(n); if (vn > 0) g.vel.addScaledVector(n, -1.5 * vn); }
    placePupil(g);
  }
}
let gameT = 0;
function updateAmbient(t, dt) {
  for (const u of utensils) {
    const s = Math.abs(Math.sin(t * u.w + u.ph)), sq = s < 0.18 ? ((0.18 - s) / 0.18) * 0.16 : 0;
    u.bob.position.y = s * u.h + u.jump;
    u.bob.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
    u.bob.rotation.set(u.kind === 'pin' ? Math.sin(t * 1.3) * 0.25 : 0, u.spin, Math.sin(t * u.w * 0.5 + u.ph) * 0.07);
  }
  for (const c of farClouds) { c.position.x += c.userData.v * dt; if (c.position.x > 55) c.position.x = -55; }
  for (const m of marshmallows) {
    const u = m.userData; u.spinBoost = Math.max(0, (u.spinBoost || 0) - dt * 4);
    m.position.y = u.base.y + Math.sin(t * 0.7 + u.ph) * 0.25; m.rotation.y += (u.spin + (u.spinBoost || 0)) * dt;
  }
  island.children.forEach((m) => {
    const u = m.userData; u.poke = Math.max(0, (u.poke || 0) - dt * 2.5);
    const b = 1 + Math.sin(t * 0.9 + u.ph) * 0.025 + Math.sin(u.poke * 9) * u.poke * 0.12;
    m.scale.set(u.base.x * b, u.base.y * (2 - b), u.base.z * b);
  });
  flags.forEach((f, i) => { f.rotation.x = Math.sin(t * 2 + i * 0.7) * 0.18; });
  if (cup) cup.root.rotation.y = Math.sin(t * 0.6) * 0.035;
}
let lastFrame = performance.now();
function frame() {
  const now = performance.now(), raw = Math.min(0.05, (now - lastFrame) / 1000), dt = raw * speed;
  lastFrame = now;
  gameT += dt;
  updateTweens(dt); updateSprings(dt); updateParticles(dt);
  updateAmbient(gameT, dt);
  for (const a of animals) updateAnimal(a, gameT, dt);
  updateGooglies(dt); updateHint(raw);
  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
cup = newCup();
spawnCustomers(false);
layout();
refreshUI();
addEventListener('resize', layout);
renderer.setAnimationLoop(frame);

/* =====================================================================
   Test / debug hooks (used by the automated verification script)
   ===================================================================== */
function decorationReport() {
  if (!cup || state.frost == null) return [];
  scene.updateMatrixWorld(true);
  const S = SHAPES[state.shape], F = FROSTINGS[state.frost], inv = cup.squish.matrixWorld.clone().invert(), out = [];
  for (const [id, node] of cup.decoMap) {
    for (const a of node.userData.anchors) {
      const p = a.position.clone().add(node.position);
      const surf = frostSurfaceY(S, F, p.x, p.z);
      const box = new THREE.Box3(), m = new THREE.Matrix4();
      a.traverse((o) => { if (o.isMesh) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(m.multiplyMatrices(inv, o.matrixWorld))); } });
      const th = Math.atan2(p.z, p.x);
      out.push({ id, type: node.userData.deco.type, x: p.x, z: p.z, anchorY: p.y, surfaceY: surf, aboveBy: surf == null ? null : p.y - surf,
        topAbove: surf == null ? null : box.max.y - surf, rn: Math.hypot(p.x, p.z) / frostRf(S, F, th), visible: node.visible });
    }
  }
  return out;
}
window.__cloudCafe = {
  get mode() { return mode; }, get step() { return currentStep(); }, get state() { return cloneState(state); },
  get historyLength() { return history.length; }, get served() { return servedCount; }, get batch() { return batchNo; },
  get palette() { return JSON.parse(JSON.stringify(palette)); }, get customers() { return customers.map((c) => c.kind); },
  get minis() { return minis.length; }, get decoNodes() { return cup ? cup.decoMap.size : 0; },
  get decoNodesInScene() { return cup ? cup.decoGroup.children.length : 0; },
  get paradeCount() { return paradeCount; }, get selectedDeco() { return selectedDeco; },
  get audioState() { return audio.ctx ? audio.ctx.state : 'none'; }, get muted() { return audio.muted; },
  get speed() { return speed; }, set speed(v) { speed = v; },
  get hintVisible() { return hint.active; },
  get busy() { return tweens.length; },
  /** Screen position of the frosting top at cupcake-local (x, z). */
  cupScreen(x = 0, z = 0) {
    scene.updateMatrixWorld(true);
    const S = SHAPES[state.shape ?? 0], F = FROSTINGS[state.frost ?? 0];
    const y = state.frost != null ? frostSurfaceY(S, F, x, z) : S.h + S.dome;
    const p = cup.squish.localToWorld(new V3(x, y ?? S.h, z)).project(camera);
    return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight };
  },
  /** Screen position of a point on the front of the paper liner (side of the cupcake). */
  cupSideScreen() {
    scene.updateMatrixWorld(true); const S = SHAPES[state.shape ?? 0];
    const p = cup.squish.localToWorld(new V3(0, S.h * 0.45, lerp(S.bottom, S.top, 0.45) * S.R(Math.PI / 2))).project(camera);
    return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight };
  },
  report: decorationReport,
  placeLocal(x, z, type) { return placeDecoration(x, z, type); },
  setDesign(shape, frost) { if (mode === 'build') { history = []; applyState({ shape, frost, decos: [] }); } },
};
